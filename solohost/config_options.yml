title: "SoloHost Browser"
eyebrow: SoloHost App
description: "Simple · Private · Lightweight browser with AI."
footer_hint: Set the access password, save, then start the app.
output_file: .env
after_save: Saved. Start or restart the app from SoloHost.
fields:
  - name: BROWSER_ACCESS_PASSWORD
    label: Access password
    type: password
    required: true
    preserve_if_blank: false
    help: "Password required after splash to open the app."
  - name: SHFH_INGEST_TOKEN
    label: Feedback Hub ingest token
    type: password
    required: false
    preserve_if_blank: true
    help: "Server-side deployment secret only. Never request it from app users; bearer ingestion requires a verified HTTPS Hub endpoint."
  - name: SHFH_HUB_URL
    label: Feedback Hub HTTPS URL
    type: text
    required: false
    preserve_if_blank: true
    help: "Optional Hub URL. Token-authenticated feedback submissions require HTTPS."
